name: Production AEO v2 sign-in canary

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-aeo-v2-signin-canary
  cancel-in-progress: false

jobs:
  browser-journey:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-signin-canary
    timeout-minutes: 8
    defaults:
      run:
        working-directory: deploy/aeo-canary
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: deploy/aeo-canary/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test contract.test.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify production sign-in, delivered recovery, and session revocation
        run: node signin.mjs
        env:
          AEO_CANARY_EMAIL: ${{ secrets.AEO_CANARY_EMAIL }}
          AEO_CANARY_PASSWORD: ${{ secrets.AEO_CANARY_PASSWORD }}
          AEO_CANARY_MAILBOX_KEY: ${{ secrets.AEO_CANARY_MAILBOX_KEY }}
          AEO_CANARY_MAILBOX_URL: ${{ vars.AEO_CANARY_MAILBOX_URL }}
